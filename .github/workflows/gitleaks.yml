# gitleaks: secret scanning on every push/PR (history + entropy aware)
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4428c2167ca110e7a1c04f9e75e4d87b  # v2 pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
