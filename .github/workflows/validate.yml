# .github/workflows/validate.yml — repo-integrity CI for wiseq-ai-onboarding
#
# Pattern basis (from our own CI suite, 2026-10):
#   - pinned action SHAs (checkout@v7 pinned; no floating tags)
#   - concurrency auto-cancel (superseded runs don't burn minutes)
#   - minimum token permissions (contents: read)
#   - timeout-minutes on the job
#   - public repo = free Actions minutes; keep the gate fast (<2 min)
#
# What this validates (scripts/validate_repo.py):
#   1. Every docs/ link in README exists
#   2. data/oss/*.json parse + schema (query/items/fields)
#   3. Bundle-spine referential integrity (every bundle's components
#      exist in the component registry)
#   4. Secret-pattern scan across all text files

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: repo integrity (docs links, data schema, spine integrity, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - name: Internal-directory guard (analysis/ must never be tracked)
        run: |
          if [ -n "$(git ls-files 'analysis/')" ]; then
            echo "::error::analysis/ contains TRACKED files — internal documents must never enter the public repo. Untrack with: git rm -r --cached analysis/ (files stay on disk via .gitignore)."
            git ls-files 'analysis/'
            exit 1
          fi
          echo "✓ no tracked files under analysis/"

      - name: Client-raw guard (raw manual + transcripts must never be tracked)
        run: |
          tracked="$(git ls-files 'data/client/Handleiding_opzet.txt' 'data/client/meetings/*.txt')"
          if [ -n "$tracked" ]; then
            echo "::error::client raw source files are TRACKED — the operations manual and meeting transcripts are pending Rob's publication approval and live in the private AIW handover folder. Untrack with: git rm --cached <file> (files stay on disk via .gitignore)."
            echo "$tracked"
            exit 1
          fi
          echo "✓ no tracked client raw source under data/client/"

      - name: Run validator
        run: python3 scripts/validate_repo.py

      - name: Vendored spine fixtures match the repo source of truth
        run: python lab/scripts/sync_spine_fixtures.py --check

      - name: Lab pytest (synthetic scenarios A–C)
        run: |
          python3 -m pip install -q pytest
          cd lab && PYTHONPATH=. python3 -m pytest -q

      - name: Data freshness (snapshots & catalogs present)
        run: |
          test -d data/oss && echo "✓ oss catalog present ($(ls data/oss/*.json | wc -l) files)"
          test -f data/wiseq-bundle-spine.csv
          test -f data/wiseq-component-registry.csv
          test -f data/leadgen-summary.md
          test -d lab && test -d docs/50-evidence
          echo "✓ all key artifacts present"
